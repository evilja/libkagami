[package]
name = "libkagami"
version = "0.1.0"
edition = "2024"
description = "ASS subtitle parsing and manipulation library extracted from pandora-toolchain"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
